<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Data Siswa</title
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="text-center mb-4">Aplikasi Manajemen Data Siswa</h2>
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white" id="form-title">Tambah Data Siswa</div>
            <div class="card-body">
                <form id="siswaForm">
                    <input type="hidden" id="siswaId">
                    <div class="mb-3">
                        <label for="nis" class="form-label">NIS</label>
                        <input type="number" class="form-control" id="nis" required>
                    </div>
                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama</label>
                        <input type="text" class="form-control" id="nama" required>
                    </div>
                    <div class="mb-3">
                        <label for="kelas" class="form-label">Kelas</label>
                        <input type="number" class="form-control" id="kelas" required>
                    </div>
                    <div class="mb-3">
                        <label for="jurusan" class="form-label">Jurusan</label>
                        <input type="text" class="form-control" id="jurusan" required>
                    </div>
                    <div class="mb-3">
                        <label for="alamat" class="form-label">Alamat</label>
                        <textarea class="form-control" id="alamat" rows="2" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success" id="btn-submit">Simpan</button>
                    <button type="button" class="btn btn-secondary d-none" id="btn-cancel" onclick="resetForm()">Batal</button>
                </form>
            </div>
        </div>
        <div class="card shadow">
            <div class="card-header bg-secondary text-white">Daftar Siswa</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>NIS</th>
                                <th>Nama</th>
                                <th>Kelas</th>
                                <th>Jurusan</th>
                                <th>Alamat</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelSiswa">
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/siswa';

        document.addEventListener('DOMContentLoaded', ambilDataSiswa);

        async function ambilDataSiswa() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const tbody = document.getElementById('tabelSiswa');
                tbody.innerHTML = '';

                data.forEach((siswa, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${siswa.nis}</td>
                            <td>${siswa.nama}</td>
                            <td>${siswa.kelas}</td>
                            <td>${siswa.jurusan}</td>
                            <td>${siswa.alamat}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editSiswa(${siswa.id}, '${siswa.nis}', '${siswa.nama}', '${siswa.kelas}', '${siswa.jurusan}', '${siswa.alamat}')">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="hapusSiswa(${siswa.id})">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Gagal mengambil data:', error);
            }
        }

        document.getElementById('siswaForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('siswaId').value;
            const dataSiswa = {
                nis: document.getElementById('nis').value,
                nama: document.getElementById('nama').value,
                kelas: document.getElementById('kelas').value,
                jurusan: document.getElementById('jurusan').value,
                alamat: document.getElementById('alamat').value
            };

            try {
                let response;
                if (id) {
                    response = await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dataSiswa)
                    });
                } else {
                    // Tambah (POST)
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dataSiswa)
                    });
                }

                const result = await response.json();
                if (response.ok) {
                    resetForm();
                    ambilDataSiswa();
                } else {
                    alert('Error: ' + (result.errors ? result.errors.join(', ') : result.error));
                }
            } catch (error) {
                console.error('Gagal menyimpan data:', error);
            }
        });

        function editSiswa(id, nis, nama, kelas, jurusan, alamat) {
            document.getElementById('siswaId').value = id;
            document.getElementById('nis').value = nis;
            document.getElementById('nama').value = nama;
            document.getElementById('kelas').value = kelas;
            document.getElementById('jurusan').value = jurusan;
            document.getElementById('alamat').value = alamat;

            document.getElementById('form-title').innerText = 'Edit Data Siswa';
            document.getElementById('btn-submit').innerText = 'Update';
            document.getElementById('btn-cancel').classList.remove('d-none');
        }

        // Fungsi Hapus Data
        async function hapusSiswa(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data ini?')) {
                try {
                    const response = await fetch(`${API_URL}/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        ambilDataSiswa();
                    } else {
                        alert('Gagal menghapus data');
                    }
                } catch (error) {
                    console.error('Gagal menghapus data:', error);
                }
            }
        }

        function resetForm() {
            document.getElementById('siswaForm').reset();
            document.getElementById('siswaId').value = '';
            document.getElementById('form-title').innerText = 'Tambah Data Siswa';
            document.getElementById('btn-submit').innerText = 'Simpan';
            document.getElementById('btn-cancel').classList.add('d-none');
        }
    </script>
</body>
</html>
